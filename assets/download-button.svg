<svg xmlns="http://www.w3.org/2000/svg" width="360" height="70" viewBox="0 0 360 70" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2ea44f" />
      <stop offset="100%" stop-color="#22863a" />
    </linearGradient>

    <!-- Inner Highlight -->
    <linearGradient id="innerStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-15%" width="120%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Button Background with Shadow -->
  <rect x="6" y="4" width="348" height="60" rx="12" fill="url(#btnGrad)" filter="url(#dropShadow)" />
  <!-- Inner Highlight Border -->
  <rect x="6.5" y="4.5" width="347" height="59" rx="11.5" fill="none" stroke="url(#innerStroke)" stroke-width="1" />

  <!-- Left Icon Container -->
  <rect x="18" y="14" width="40" height="40" rx="10" fill="#ffffff" fill-opacity="0.15" />

  <!-- Windows Logo Vector inside Container -->
  <g fill="#ffffff">
    <rect x="27" y="23" width="9" height="9" rx="1.5" />
    <rect x="38" y="23" width="9" height="9" rx="1.5" />
    <rect x="27" y="34" width="9" height="9" rx="1.5" />
    <rect x="38" y="34" width="9" height="9" rx="1.5" />
  </g>

  <!-- Typography -->
  <text x="72" y="33" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.2">Download for Windows</text>
  <text x="72" y="51" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="11.5" font-weight="500" fill="#ffffff" fill-opacity="0.85">RoR2_Profile_Unlocker.exe • Portable (v1.0.0)</text>

  <!-- Right Download Arrow Icon -->
  <circle cx="324" cy="34" r="14" fill="#ffffff" fill-opacity="0.12" />
  <path d="M324 28v9m0 0l-3.5-3.5m3.5 3.5l3.5-3.5M319 40h10" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
</svg>
